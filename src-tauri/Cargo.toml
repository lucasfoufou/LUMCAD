[package]
name = "lumcad"
version = "0.1.0"
description = "Open-source, AI-enabled, lightweight 2D CAD software"
authors = ["Lucas FOUGERAS", "DIGITAL CACTUS"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/lucasfoufou/LUMCAD"

[lib]
name = "lumcad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8"
base64 = "0.22"
rmcp = { version = "3.0.0", features = ["schemars", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["net", "sync", "time"] }
tokio-util = "0.7"
url = "2"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSPasteboard", "NSPrintInfo", "NSPrinter"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation"] }

[dev-dependencies]
rmcp = { version = "3.0.0", features = ["client", "transport-streamable-http-client-reqwest"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tempfile = "3"
